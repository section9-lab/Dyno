name: pi-work
options:
  bundleIdPrefix: com.section9lab
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

# Configurations split signing across Debug (local-only, ad-hoc) and
# Release (team-signed for distribution). This avoids hard-coding any
# developer's personal Team ID into the repo — anyone can `xcodegen
# generate && xcodebuild` Debug without an Apple Developer account.
configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: YES
  configs:
    Debug:
      CODE_SIGN_STYLE: Manual
      CODE_SIGN_IDENTITY: "-"
      DEVELOPMENT_TEAM: ""
      PROVISIONING_PROFILE_SPECIFIER: ""
    Release:
      # Distribution build still uses the original team. Override via
      # `PI_WORK_DEVELOPMENT_TEAM` env when invoking xcodebuild on CI or
      # other developer machines.
      CODE_SIGN_STYLE: Automatic
      DEVELOPMENT_TEAM: 6BWZP56JX9

targets:
  PiWork:
    type: application
    platform: macOS
    sources:
      - path: PiWork/App
      - path: PiWork/Core
      - path: PiWork/Features
      - path: PiWork/Shared
      - path: PiWork/Resources
      - path: skills
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.section9lab.PiWork
        INFOPLIST_FILE: PiWork/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: PiWork/Resources/PiWork.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "-"
          DEVELOPMENT_TEAM: ""
          PROVISIONING_PROFILE_SPECIFIER: ""
        Release:
          CODE_SIGN_STYLE: Automatic
          DEVELOPMENT_TEAM: 6BWZP56JX9
    COMBINE_HIDPI_IMAGES: YES
    DEVELOPMENT_LANGUAGE: en
    LD_RUNPATH_SEARCH_PATHS:
      - $(inherited)
      - "@executable_path/../Frameworks"
    entitlements:
      path: PiWork/Resources/PiWork.entitlements
      properties:
        com.apple.security.app-sandbox: false

  PiWorkTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: PiWorkTests
    dependencies:
      - target: PiWork
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.section9lab.PiWorkTests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/PiWork.app/Contents/MacOS/PiWork"

schemes:
  PiWork:
    build:
      targets:
        PiWork: all
        PiWorkTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PiWorkTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
