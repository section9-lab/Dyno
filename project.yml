name: Impulse
options:
  bundleIdPrefix: com.section9lab
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

# Configurations split signing across Debug (local-only, ad-hoc) and
# Release (team-signed for distribution). This avoids hard-coding any
# developer's personal Team ID into the repo — anyone can `xcodegen
# generate && xcodebuild` Debug without an Apple Developer account.
configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: YES
  configs:
    Debug:
      # Local-only signing. Xcode shows this as "Sign to Run Locally".
      # No Team required.
      CODE_SIGN_STYLE: Manual
      CODE_SIGN_IDENTITY: "-"
      DEVELOPMENT_TEAM: ""
      PROVISIONING_PROFILE_SPECIFIER: ""
    Release:
      # Distribution build still uses the original team. Override via
      # `IMPULSE_DEVELOPMENT_TEAM` env when invoking xcodebuild on CI or
      # other developer machines.
      CODE_SIGN_STYLE: Automatic
      DEVELOPMENT_TEAM: 6BWZP56JX9

packages:
  SwiftHarnessAgent:
    path: ../SwiftHarnessAgent
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    from: "2.4.0"

targets:
  Impulse:
    type: application
    platform: macOS
    sources:
      - path: Impulse/App
      - path: Impulse/Core
      - path: Impulse/Features
      - path: Impulse/Shared
      - path: Impulse/Resources
      - path: skills
        type: folder
        buildPhase: resources
    dependencies:
      - package: SwiftHarnessAgent
      - package: MarkdownUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.section9lab.Impulse
        INFOPLIST_FILE: Impulse/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Impulse/Resources/Impulse.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "-"
          DEVELOPMENT_TEAM: ""
          PROVISIONING_PROFILE_SPECIFIER: ""
        Release:
          CODE_SIGN_STYLE: Automatic
          DEVELOPMENT_TEAM: 6BWZP56JX9
    COMBINE_HIDPI_IMAGES: YES
    DEVELOPMENT_LANGUAGE: en
    LD_RUNPATH_SEARCH_PATHS:
      - $(inherited)
      - "@executable_path/../Frameworks"
    entitlements:
      path: Impulse/Resources/Impulse.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true

  ImpulseTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ImpulseTests
    dependencies:
      - target: Impulse
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.section9lab.ImpulseTests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Impulse.app/Contents/MacOS/Impulse"

schemes:
  Impulse:
    build:
      targets:
        Impulse: all
        ImpulseTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ImpulseTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
