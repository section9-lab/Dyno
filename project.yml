name: Impulse
options:
  bundleIdPrefix: com.section9lab
  deploymentTarget:
    macOS: "15.7"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.7"
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES

packages:
  SwiftAgent:
    url: https://github.com/section9-lab/SwiftCodingAgent.git
    branch: main
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    from: "2.4.0"

targets:
  Impulse:
    type: application
    platform: macOS
    sources:
      - path: Impulse/App
      - path: Impulse/Core
      - path: Impulse/Features
      - path: Impulse/Shared
      - path: Impulse/Resources
    dependencies:
      - package: SwiftCodingAgent
      - package: MarkdownUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.section9lab.Impulse
        INFOPLIST_FILE: Impulse/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Impulse/Resources/Impulse.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/../Frameworks"
    entitlements:
      path: Impulse/Resources/Impulse.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true

schemes:
  Impulse:
    build:
      targets:
        Impulse: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
