name: pi-work
options:
  bundleIdPrefix: cc.vibevibe
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: 5.0
    MACOSX_DEPLOYMENT_TARGET: "13.0"
  configs:
    Debug:
      CODE_SIGN_STYLE: Manual
      CODE_SIGN_IDENTITY: "-"
      DEVELOPMENT_TEAM: ""
      PROVISIONING_PROFILE_SPECIFIER: ""
      ENABLE_HARDENED_RUNTIME: NO
      ENABLE_TESTABILITY: YES
    Release:
      # Distribution builds should use a real Developer ID team so the app
      # can be notarized. Override DEVELOPMENT_TEAM for CI/release builds.
      CODE_SIGN_STYLE: Automatic
      ENABLE_HARDENED_RUNTIME: YES

targets:
  PiWork:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: PiWork
        excludes:
          - "Resources/PiAgent/arm64/**"
          - "Resources/PiAgent/x64/**"
    resources:
      - path: PiWork/Resources
        excludes:
          - "PiAgent/arm64/**"
          - "PiAgent/x64/**"
    info:
      path: PiWork/Resources/Info.plist
      properties:
        CFBundleDisplayName: pi-work
        CFBundleShortVersionString: 0.1.0
        # Must be a string: CFNetwork builds the default User-Agent from this
        # and calls -length on it, so a numeric value crashes on the first
        # URLSession request.
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "13.0"
        NSHumanReadableCopyright: Copyright © section9-lab
        # openauth issuer for Google / email-OTP sign-in. Overridable at
        # runtime via the PI_WORK_OPENAUTH_ISSUER_URL env var or the
        # auth.openauth.issuerURL user default.
        OpenAuthIssuerURL: https://auth.vibevibe.cc
        CFBundleURLTypes:
          - CFBundleURLName: cc.vibevibe.pi-work.auth
            CFBundleURLSchemes:
              - pi-work
    entitlements:
      path: PiWork/Resources/PiWork.entitlements
      properties:
        com.apple.security.app-sandbox: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cc.vibevibe.pi-work
        PRODUCT_NAME: PiWork
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: 0.1.0
    postCompileScripts:
      - name: "Stage bundled pi agent binary"
        script: |
          set -e

          # Map the architectures Xcode is actually building to the pi
          # release's naming. Keying off `uname -m` instead would bundle only
          # the build machine's agent, so a universal app would throw
          # binaryNotFound on the other architecture — PiAgentProcess resolves
          # PiAgent/<arch>/pi per slice via `#if arch(...)`, and that only
          # surfaces at runtime on someone else's Mac.
          PI_AGENT_ARCHS=""
          for ARCH in $ARCHS; do
            case "$ARCH" in
              arm64)  PI_AGENT_ARCHS="$PI_AGENT_ARCHS arm64" ;;
              x86_64) PI_AGENT_ARCHS="$PI_AGENT_ARCHS x64" ;;
              *)      echo "warning: no pi agent release for architecture $ARCH" ;;
            esac
          done

          for PI_ARCH in $PI_AGENT_ARCHS; do
            SRC="$SRCROOT/PiWork/Resources/PiAgent/$PI_ARCH"

            # The agent binary is gitignored (~80MB), so a fresh clone has none.
            # Fetch it on demand instead of shipping an app whose agent can never
            # start — a missing binary only surfaces at runtime otherwise.
            if [ ! -x "$SRC/pi" ]; then
              echo "pi agent binary missing for $PI_ARCH - fetching..."
              # Don't let set -e abort here: fall through so the check below can
              # print an actionable message instead of a bare non-zero exit.
              PI_ARCHS="$PI_ARCH" "$SRCROOT/scripts/fetch-pi-binary.sh" || true
            fi

            if [ ! -x "$SRC/pi" ]; then
              echo "error: could not obtain the pi agent binary for $PI_ARCH. Run scripts/fetch-pi-binary.sh manually (needs network), then rebuild."
              exit 1
            fi

            DEST="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/PiAgent/$PI_ARCH"
            mkdir -p "$DEST"
            cp -R "$SRC/." "$DEST/"
            echo "Staged pi agent binary ($PI_ARCH) into app bundle."
          done

  PiWorkTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: PiWorkTests
    dependencies:
      - target: PiWork
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cc.vibevibe.pi-work.tests
        PRODUCT_NAME: PiWorkTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/PiWork.app/Contents/MacOS/PiWork"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  PiWork:
    build:
      targets:
        PiWork: all
        PiWorkTests: [test]
    test:
      targets:
        - PiWorkTests
    run:
      config: Debug
