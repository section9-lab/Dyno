name: Release macOS

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.suffix }} DMG
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            suffix: arm64
          - runner: macos-15-intel
            arch: x86_64
            suffix: x86_64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v5

      - name: Validate release secrets
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=0
          for name in \
            MACOS_CERTIFICATE_P12 \
            MACOS_CERTIFICATE_PASSWORD \
            APPLE_ID \
            APPLE_APP_SPECIFIC_PASSWORD \
            APPLE_TEAM_ID
          do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not configured"
              missing=1
            fi
          done
          exit "$missing"

      - name: Select Xcode 26
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.0.app/Contents/Developer
          xcodebuild -version

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Install Agent Host dependencies
        working-directory: AgentHost
        run: bun install --frozen-lockfile --registry=https://registry.npmjs.org

      - name: Validate tag version
        run: |
          PROJECT_VERSION="$(awk '$1 == "MARKETING_VERSION:" { print $2; exit }' project.yml)"
          if [ -z "$PROJECT_VERSION" ]; then
            echo "::error::MARKETING_VERSION is missing from project.yml"
            exit 1
          fi
          if [ "$GITHUB_REF_NAME" != "v$PROJECT_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match project version v$PROJECT_VERSION"
            exit 1
          fi
          echo "PROJECT_VERSION=$PROJECT_VERSION" >> "$GITHUB_ENV"

      - name: Import Developer ID certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          certificate_path="$RUNNER_TEMP/developer-id.p12"
          keychain_path="$RUNNER_TEMP/release.keychain-db"
          keychain_password="$(uuidgen)"

          printf '%s' "$CERTIFICATE_BASE64" | base64 -D > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path"

          signing_identity="$(
            security find-identity -v -p codesigning "$keychain_path" \
              | awk '/Developer ID Application/ { print $2; exit }'
          )"
          if [ -z "$signing_identity" ]; then
            echo "::error::The certificate does not contain a Developer ID Application identity"
            exit 1
          fi
          echo "SIGNING_IDENTITY=$signing_identity" >> "$GITHUB_ENV"

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build signed archive
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          archive_path="$RUNNER_TEMP/PiWork-${{ matrix.suffix }}.xcarchive"
          xcodebuild \
            -project pi-work.xcodeproj \
            -scheme PiWork \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -archivePath "$archive_path" \
            ARCHS="${{ matrix.arch }}" \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$SIGNING_IDENTITY" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            OTHER_CODE_SIGN_FLAGS="--timestamp" \
            MARKETING_VERSION="$PROJECT_VERSION" \
            archive
          echo "ARCHIVE_PATH=$archive_path" >> "$GITHUB_ENV"

      - name: Verify signed application
        run: |
          app_path="$ARCHIVE_PATH/Products/Applications/PiWork.app"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          actual_arch="$(lipo -archs "$app_path/Contents/MacOS/PiWork")"
          if [ "$actual_arch" != "${{ matrix.arch }}" ]; then
            echo "::error::Expected ${{ matrix.arch }} executable, found $actual_arch"
            exit 1
          fi

      - name: Create signed DMG
        run: |
          app_path="$ARCHIVE_PATH/Products/Applications/PiWork.app"
          staging_path="$RUNNER_TEMP/dmg-${{ matrix.suffix }}"
          dmg_path="$RUNNER_TEMP/PiWork-${PROJECT_VERSION}-macos-${{ matrix.suffix }}.dmg"

          mkdir -p "$staging_path"
          ditto "$app_path" "$staging_path/PiWork.app"
          ln -s /Applications "$staging_path/Applications"
          hdiutil create \
            -volname "PiWork $PROJECT_VERSION" \
            -srcfolder "$staging_path" \
            -format UDZO \
            -ov \
            "$dmg_path"
          codesign --force --timestamp --sign "$SIGNING_IDENTITY" "$dmg_path"
          echo "DMG_PATH=$dmg_path" >> "$GITHUB_ENV"

      - name: Notarize and staple DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcrun notarytool submit "$DMG_PATH" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait \
            --timeout 30m
          xcrun stapler staple "$DMG_PATH"
          xcrun stapler validate "$DMG_PATH"

      - name: Stage release artifact
        run: |
          mkdir -p dist
          mv "$DMG_PATH" dist/

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: PiWork-${{ matrix.suffix }}
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download DMG artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: PiWork-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: sha256sum ./*.dmg > SHA256SUMS.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/*.dmg \
            dist/SHA256SUMS.txt \
            --verify-tag \
            --generate-notes \
            --title "PiWork $GITHUB_REF_NAME"
